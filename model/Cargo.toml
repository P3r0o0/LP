[package]
name = "lwe-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rand_core = "0.6"
sha3 = "0.10"
subtle = "2.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3.5"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
